    <script>
      // Gracefully suppress benign Vite HMR WebSocket connection notices in proxy/preview environments
      window.addEventListener('unhandledrejection', function (event) {
        var str = String(event.reason || '') + ' ' + String(event.reason && event.reason.message ? event.reason.message : '');
        if (str.toLowerCase().includes('websocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function (event) {
        var str = String(event.message || '') + ' ' + String(event.error ? event.error.message : '');
        if (str.toLowerCase().includes('websocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
